<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Echoelmusic — OG Image (Social Share 1200x630) — grayscale on black. Rendered to og-cover.png by scripts/render-og-cover.py. -->

  <!-- Background -->
  <rect width="1200" height="630" fill="#000000"/>

  <!-- E mark (centered at 190, 315) -->
  <text x="190" y="275" text-anchor="middle"
        font-family="'Atkinson Hyperlegible',-apple-system,sans-serif"
        font-weight="700" font-size="190" fill="#e0e0e0">E</text>

  <!-- Echo waves -->
  <g stroke="#e0e0e0" fill="none" stroke-width="7" stroke-linecap="round">
    <path d="M102,320 C122,295 149,295 169,320 C189,345 211,345 231,320 C251,295 278,295 298,320" opacity="0.8"/>
    <path d="M102,360 C122,335 149,335 169,360 C189,385 211,385 231,360 C251,335 278,335 298,360" opacity="0.4"/>
    <path d="M102,400 C122,375 149,375 169,400 C189,425 211,425 231,400 C251,375 278,375 298,400" opacity="0.2"/>
  </g>

  <!-- App name -->
  <text x="420" y="268" font-family="'Atkinson Hyperlegible',-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif"
        font-size="80" font-weight="700" fill="#e0e0e0" letter-spacing="-3">
    Echoelmusic
  </text>

  <!-- What it is: the same sentence as the home page's h1 -->
  <text x="420" y="330" font-family="'Atkinson Hyperlegible',-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif"
        font-size="34" fill="#e0e0e0" font-weight="700" letter-spacing="-0.5" opacity="0.85">
    A music workstation for iPhone and iPad
  </text>

  <!-- What you do with it: the four verbs of the store text -->
  <text x="420" y="386" font-family="'Atkinson Hyperlegible',-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif"
        font-size="22" fill="#e0e0e0" font-weight="400" opacity="0.6">
    Write, arrange, record and mix songs.
  </text>

  <!-- State and price, said once -->
  <text x="420" y="470" font-family="'Atkinson Hyperlegible',-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif"
        font-size="20" fill="#e0e0e0" font-weight="700" opacity="0.6">
    Free  ·  in TestFlight
  </text>

  <!-- Bottom line -->
  <line x1="0" y1="620" x2="1200" y2="620" stroke="#e0e0e0" stroke-width="1" opacity="0.04"/>
</svg>
