# =============================================================================
# ECHOEL STUDIO — TESTFLIGHT
# =============================================================================
# Archives EchoelStudio/project.yml (the app com.echoelmusic.app plus its one AUv3 extension
# com.echoelmusic.app.auv3), signs it with the App Store Connect API key and uploads it to
# TestFlight. Same signing route as the legacy testflight.yml (automatic signing,
# -allowProvisioningUpdates, fresh keychain), pointed at the Studio spec.
#
# Deploy: bump EchoelStudio/RELEASE and push, or run it by hand. Ordinary pushes never deploy.
# ⚠️ ANY change to EchoelStudio/RELEASE uploads — not only a bump (the legacy lesson #1151 in
# .deploy/release). Editing the test list IS a deploy.
# A push to main never uploads (ultra-audit 2026-10-20, TF-6): a merge made by a person carries
# RELEASE in its diff whenever main lags behind, and would upload an unplanned build from main.
# The legacy app's tokenless deploy (.deploy/release) is frozen so the two never alternate on the
# same TestFlight record.
# =============================================================================

name: "Echoel Studio TestFlight"

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - 'main'
    paths:
      - 'EchoelStudio/RELEASE'

concurrency:
  group: studio-testflight-${{ github.ref }}
  cancel-in-progress: false

env:
  XCODE_VERSION: '26.2'
  # A new version train (11.0.0); offset so every number is also above the legacy builds.
  BUILD_NUMBER_OFFSET: 10000

jobs:
  ios:
    name: "Archive + Upload"
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: "Check secrets"
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          [ -z "$ASC_KEY_ID" ] && missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -z "$ASC_ISSUER_ID" ] && missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -z "$ASC_KEY" ] && missing="$missing APP_STORE_CONNECT_PRIVATE_KEY"
          [ -z "$TEAM_ID" ] && missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::$missing"
            exit 1
          fi

      - name: "Verify iOS 26 SDK (ITMS-90725)"
        run: |
          SDK_VER=$(xcodebuild -showsdks | grep -oE "iphoneos[0-9]+" | tail -1 | grep -oE "[0-9]+")
          echo "iOS SDK $SDK_VER"
          if [ -z "$SDK_VER" ] || [ "$SDK_VER" -lt 26 ]; then
            echo "::error title=SDK Too Old::iOS SDK $SDK_VER is below 26"
            exit 1
          fi

      - name: "Setup XcodeGen"
        uses: ./.github/actions/setup-xcodegen
        with:
          version: '2.42.0'

      - name: "Generate project"
        run: |
          BUILD=$(( ${{ env.BUILD_NUMBER_OFFSET }} + ${{ github.run_number }} ))
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          sed -i '' "s/\${BUILD_NUMBER:=1}/$BUILD/" EchoelStudio/project.yml
          grep -n "CURRENT_PROJECT_VERSION\|MARKETING_VERSION" EchoelStudio/project.yml
          xcodegen generate --spec EchoelStudio/project.yml

      - name: "Setup API key & keychain"
        env:
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          KEYCHAIN_PATH="$HOME/Library/Keychains/build.keychain-db"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

      - name: "Setup signing certificates"
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Revokes stale development certificates so automatic signing can mint fresh profiles
          # for the app and the extension (the legacy workflow learned this the hard way).
          gem install fastlane:2.225.0 -N --no-document
          set +eo pipefail
          fastlane ios setup_signing 2>&1 | tee /tmp/signing.log
          [ ${PIPESTATUS[0]} -ne 0 ] && echo "::warning title=Signing setup non-zero::falling back to automatic signing"
          exit 0

      - name: "Archive"
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          API_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          set +eo pipefail
          xcodebuild archive \
            -project EchoelStudio/EchoelStudio.xcodeproj \
            -scheme EchoelStudio \
            -destination "generic/platform=iOS" \
            -archivePath ./build/EchoelStudio.xcarchive \
            -configuration Release \
            -derivedDataPath ./build/DerivedData \
            -allowProvisioningUpdates \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyPath "$API_KEY_PATH" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Automatic \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee /tmp/archive.log
          RESULT=${PIPESTATUS[0]}
          set -eo pipefail
          if [ $RESULT -ne 0 ]; then
            echo "::error title=Archive failed::$(grep -E ': error: |provision|signing|certificate' /tmp/archive.log | tail -15 | tr '\n' ' | ')"
            # What the profiles Xcode fetched actually grant, so a capability mismatch is named.
            for profile in ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/*.mobileprovision \
                           ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
              [ -f "$profile" ] || continue
              security cms -D -i "$profile" > /tmp/profile.plist 2>/dev/null || continue
              name=$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist 2>/dev/null)
              groups=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' /tmp/profile.plist 2>/dev/null | tr -d '\n ' || echo none)
              echo "::warning title=Profile::$name — application-groups: ${groups:-none}"
            done
            { echo '## Archive failed'; echo '```'; grep -E ': error: ' /tmp/archive.log | head -30 || true; echo '---'; tail -60 /tmp/archive.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: "Verify the archive carries the Audio Unit extension"
        run: |
          APP=$(ls -d ./build/EchoelStudio.xcarchive/Products/Applications/*.app | head -1)
          APPEX="$APP/PlugIns/EchoelPlugins.appex"
          if [ ! -d "$APPEX" ]; then
            echo "::error title=No AUv3::$APPEX is missing; the plugins would not ship"
            ls -la "$APP/PlugIns" || true
            exit 1
          fi
          for plist in "$APP/Info.plist" "$APPEX/Info.plist"; do
            echo "$plist: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist") $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist") ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist"))"
          done
          APP_VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          EXT_VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APPEX/Info.plist")
          if [ "$APP_VER" != "$BUILD" ] || [ "$EXT_VER" != "$BUILD" ]; then
            echo "::error title=Build number::app $APP_VER, extension $EXT_VER, expected $BUILD"
            exit 1
          fi

      - name: "Export & upload to TestFlight"
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          API_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          cat > /tmp/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>uploadSymbols</key>
              <true/>
              <key>destination</key>
              <string>upload</string>
          </dict>
          </plist>
          PLIST
          # App Store Connect fails transiently (profile minting, 503, auth hiccups); retry only those.
          TRANSIENT='No profiles for|couldn.t be read because it isn.t in the correct format|Service Temporarily Unavailable|503|No Accounts with App Store Connect Access|Unable to authenticate with App Store Connect|returned unexpected content|timed out|connection was lost|Could not connect to the server'
          RESULT=1
          for attempt in 1 2 3 4 5; do
            echo "--- export/upload attempt $attempt/5 ---"
            set +eo pipefail
            xcodebuild -exportArchive \
              -archivePath ./build/EchoelStudio.xcarchive \
              -exportPath ./build \
              -exportOptionsPlist /tmp/ExportOptions.plist \
              -allowProvisioningUpdates \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyPath "$API_KEY_PATH" \
              2>&1 | tee /tmp/export.log
            RESULT=${PIPESTATUS[0]}
            set -eo pipefail
            [ $RESULT -eq 0 ] && break
            if grep -qE "$TRANSIENT" /tmp/export.log; then
              echo "::warning title=Transient export retry::attempt $attempt — retrying in 30 s"
              sleep 30
            else
              break
            fi
          done
          if [ $RESULT -ne 0 ]; then
            echo "::error title=Export/upload failed::$(tail -20 /tmp/export.log | tr '\n' ' | ')"
            { echo '## Export/upload failed'; echo '```'; tail -80 /tmp/export.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "## Uploaded Echoel Studio 11.0.0 ($BUILD) to TestFlight" >> "$GITHUB_STEP_SUMMARY"

      - name: "Cleanup"
        if: always()
        run: |
          security delete-keychain "$HOME/Library/Keychains/build.keychain-db" 2>/dev/null || true
          rm -rf ~/.appstoreconnect/private_keys
