# =============================================================================
# ECHOELMUSIC - AUTO-MERGE CLAUDE BRANCHES + TRIGGER TESTFLIGHT
# =============================================================================
# Direct merge approach: checkout main, merge claude branch commit, push,
# then dispatch TestFlight workflow for all Apple platforms.
# Note: GITHUB_TOKEN pushes don't trigger other workflows, so we dispatch
# TestFlight directly from this workflow after a successful merge.
#
# ---------------------------------------------------------------------------
# #1405 (founder 2026-09-21) — THIS MERGE NOW WAITS FOR A GATE. It did not
# before, and that was the finding #683 recorded on 2026-08-21: no `needs:`,
# no `workflow_run:`, no conclusion read anywhere, so the compile check, the
# pipeline and this merge ran in PARALLEL and the merge won every time.
#
# It was never a hypothesis. #681 failed `Xcode Compile Check` (run
# 32457537356, `f61be63`) and reached `origin/main` regardless — `main` did not
# compile for ten minutes. It happened again on 2026-09-20 (`edc37a4a5`, nine
# minutes). The damage is to DEVELOPERS, not users: the TestFlight dispatch
# below is `if: false`, so an unverified commit reaches `main` and never a
# phone — but anyone who pulls inside that window has no working test bundle,
# and therefore not one working guard of this repo.
#
# WHY THIS IS A POLL AND NOT A `needs:` OR A `workflow_run:` TRIGGER, which is
# the shape anyone would reach for first. `Echoelmusic CI/CD Pipeline` reports
# `failure` on EVERY push because of #396, so its CONCLUSION carries no
# information at all and a dependency on it would block every merge forever.
# The decisive signal is one STEP inside that run, `Build for Testing` — which
# is exactly what this repo's own reading rule says (`Tests/CISmoke/CLAUDE.md`
# section 5, and `.claude/rules/context.md` section 3: "read the job steps").
# A step conclusion is not reachable from `needs:`; it has to be asked for. So
# the gate below polls the API: the compile check by its conclusion, the
# pipeline by that one step.
#
# AND IT ONLY APPLIES WHERE THERE IS SOMETHING TO VERIFY. Both gate workflows
# fire on `Sources/**`, `Tests/**`, `Package.swift`, `project.yml` and their
# OWN file — so a push touching only some other workflow triggers this merge
# and NEITHER gate, and waiting for a run that can never start would deadlock
# exactly the commits that repair CI. The scope step below asks whether the
# merge changes code; if it does not, `main` compiles afterwards exactly as it
# did before and there is nothing for a gate to say.
#
# 2026-10-20 — THE SESSION TOOK THE CI OVER (founder: „Die Echoelmusic CI
# übernehmen“), AND ECHOEL STUDIO IS NOW A GATED AREA OF ITS OWN. Until then a
# push touching only EchoelStudio/ never started this job, and a merge that
# carried Studio code was gated by two LEGACY gates that never build it. Now:
# EchoelStudio/** starts the job, the scope step names the touched areas, and
# each area waits for its own gate — the legacy app for the two above, Echoel
# Studio for `Echoel Studio` (studio.yml). A gate with no run on this commit is
# started once by dispatch instead of deadlocking the branch, and a job whose
# branch moved on stops as `superseded` without merging — but only when the newer push
# started a merge job of its own; otherwise the commit is refused, never left behind silently.
# Guard: Tests/CISmoke/TheAutoMergeWaitsForTheGatesTests.swift (claim 8).
# =============================================================================
name: Auto-Merge Claude Branch

on:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'project.yml'
      - 'EchoelStudio/**'
      - '.github/workflows/**'

permissions:
  contents: write
  actions: write

# ONE GROUP PER BRANCH (2026-10-31, conductor round 2 — the founder delegated). The group was
# `auto-merge-main`, one for every branch. GitHub keeps at most ONE pending run per group, so
# with several branches green at once each new push CANCELLED the pending merge job of another
# branch (`cancel-in-progress: false` protects only the RUNNING one): on 2026-10-31 four team
# branches lost their jobs within minutes, green gates and all, and none of them could re-run
# it ("Resource not accessible by integration"). A green branch did not land.
#
# Per branch, a pending job is displaced only by a NEWER PUSH OF THE SAME BRANCH, whose commit
# contains it — exactly the `superseded` case the gate step already handles. Different branches
# no longer wait for or cancel each other; they meet only at `git push origin main`, and the
# merge step below re-reads main, merges again and retries when that push is rejected as
# non-fast-forward. That is the whole serialisation two parallel merges need: the push to main
# is atomic, a lost race is retried against the new main, and a real conflict still fails loudly.
# `cancel-in-progress: false` stays: cancelling the running job would drop a commit that had
# already passed its gates.
concurrency:
  group: auto-merge-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Auto-Merge to Main
    runs-on: ubuntu-latest
    # Was 10. The gate below waits for a macOS compile that routinely takes 15
    # minutes and is allowed 40 in its own workflow; a 10-minute ceiling here
    # would have turned every slow-but-green build into a failed merge.
    timeout-minutes: 60

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch pushed commit
        id: fetch
        run: |
          echo "=============================================="
          echo "  FETCHING PUSHED COMMIT"
          echo "=============================================="
          echo "Push SHA: ${{ github.sha }}"
          echo "Push branch: ${{ github.ref_name }}"

          # ⛔ 2026-09-25 (founder-approved): this fetch said `--depth=50`. On a full clone that
          # does not deepen anything — it makes the repo SHALLOW, cutting the pushed commit's
          # ancestry 50 commits down. Once the branch ran 113 commits ahead of main (the
          # 2026-09-24 overnight run), main's tip sat below the cut, `git merge` found no common
          # ancestor and failed with "refusing to merge unrelated histories", reported in the
          # Summary as `conflict` — on a commit whose two gates were green. The checkout above
          # already has full history, so the pushed commit is fetched WITHOUT a depth limit.
          # Guard: TheAutoMergeWaitsForTheGatesTests (the fetch-depth claim).
          git fetch origin ${{ github.sha }} || git fetch origin --all

          if git cat-file -e ${{ github.sha }}^{commit} 2>/dev/null; then
            echo "commit_exists=true" >> $GITHUB_OUTPUT
            echo "[OK] Commit ${{ github.sha }} is accessible"
          else
            echo "commit_exists=false" >> $GITHUB_OUTPUT
            echo "[ERROR] Commit ${{ github.sha }} not found"
            exit 1
          fi

      - name: Does this merge change code?
        if: steps.fetch.outputs.commit_exists == 'true'
        id: scope
        run: |
          set -uo pipefail
          echo "=============================================="
          echo "  SCOPE: is there anything for a gate to say?"
          echo "=============================================="
          # HEAD is `main` (this job checks main out), so the diff to the pushed
          # commit is exactly the content the merge would bring. That asks the
          # real question and needs no merge-base — which a shallow fetch of the
          # branch might not even contain.
          CHANGED=$(git diff --name-only HEAD..${{ github.sha }} 2>/dev/null || echo "")
          echo "$CHANGED"
          echo ""
          # TWO areas, each with its OWN gate (2026-10-20, the session took the CI over:
          # „Die Echoelmusic CI übernehmen“). The legacy app's list stays exactly the set
          # its two gate workflows cover; Echoel Studio is a separate list with a separate
          # gate, `Echoel Studio` (studio.yml), never folded into the legacy list.
          legacy=false
          studio=false
          if printf '%s\n' "$CHANGED" \
               | grep -Eq '^(Sources/|Tests/|Package\.swift$|project\.yml$)'; then
            legacy=true
          fi
          if printf '%s\n' "$CHANGED" | grep -Eq '^EchoelStudio/'; then
            studio=true
          fi
          echo "touches_legacy=$legacy" >> $GITHUB_OUTPUT
          echo "touches_studio=$studio" >> $GITHUB_OUTPUT
          if [ "$legacy" = "true" ] || [ "$studio" = "true" ]; then
            echo "touches_code=true" >> $GITHUB_OUTPUT
            echo "[GATE] This merge changes code — legacy=$legacy studio=$studio; every gate of a touched area must be green."
          else
            echo "touches_code=false" >> $GITHUB_OUTPUT
            echo "[GATE] No code change. No gate workflow can even start on"
            echo "       this push, and main compiles afterwards exactly as before."
          fi

      - name: Wait for the gates that decide whether main compiles
        if: steps.fetch.outputs.commit_exists == 'true' && steps.scope.outputs.touches_code == 'true'
        id: gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          NEED_LEGACY: ${{ steps.scope.outputs.touches_legacy }}
          NEED_STUDIO: ${{ steps.scope.outputs.touches_studio }}
        run: |
          set -uo pipefail
          echo "=============================================="
          echo "  WAITING FOR THE DECISIVE GATES"
          echo "=============================================="
          START=$(date +%s)
          DEADLINE=$(( START + 45 * 60 ))
          # A gate that has not even produced a RUN after this long is not slow,
          # it is absent — a path filter kept it out, or it was never queued.
          # Absent is REFUSED, never assumed green.
          GRACE=300
          compile=""
          testbuild=""
          studio=""
          # An area the merge does not touch needs no gate. `not-needed` is a word no
          # gate run can produce, so it is never read as a green run of that gate.
          if [ "$NEED_LEGACY" != "true" ]; then compile="not-needed"; testbuild="not-needed"; fi
          if [ "$NEED_STUDIO" != "true" ]; then studio="not-needed"; fi
          compile_since=$START; ci_since=$START; studio_since=$START
          compile_sent=""; ci_sent=""; studio_sent=""

          # Where the branch points now; empty when the remote cannot be read.
          tip() { git ls-remote origin "refs/heads/$BRANCH" 2>/dev/null | cut -f1; }
          # A newer push owns the merge ONLY if it started a merge job of its own: that job
          # runs after this one (same branch, same concurrency group) and brings this commit with it,
          # so this one stops WITHOUT merging. A push that touches only docs/, memory/ or
          # scratchpads/ starts no merge job (ultra-audit 2026-10-20, CI-04a): standing
          # down then would leave this commit unmerged with every run reporting success.
          # So the newer push is looked up first (a minute, the run may still be queuing),
          # and without a merge job of its own this returns and the caller REFUSES loudly.
          superseded() {
            for _ in 1 2 3 4 5 6; do
              own=$(gh api "repos/$REPO/actions/runs?head_sha=$2&per_page=100" 2>/dev/null \
                    | jq -r '[.workflow_runs[]? | select(.name == "Auto-Merge Claude Branch")] | length' 2>/dev/null)
              if [ -n "$own" ] && [ "$own" != "0" ]; then
                echo "superseded=true" >> $GITHUB_OUTPUT
                echo "[SKIP] $BRANCH moved past ${SHA} to $2 ($1); that push's merge job merges it, this one does not."
                exit 0
              fi
              sleep 10
            done
            echo "[GATE] $BRANCH moved past ${SHA} to $2 ($1), and that push started no merge job. Not standing down."
            return 1
          }
          # Every gate workflow has `workflow_dispatch`. A gate that never started on
          # this commit — its path filter did not match THIS push although the merge
          # brings code it covers (main lagged behind, or a workflow-only fix) — is
          # started ONCE on the branch while the branch still points here, so its run
          # carries this very SHA. Before 2026-10-20 such a commit was refused after the
          # grace period, and the branch stayed blocked until a later push happened to
          # touch the right paths. A dispatch that fails is still refused (never-ran).
          dispatch() {
            t=$(tip)
            if [ -n "$t" ] && [ "$t" != "$SHA" ]; then
              superseded "before starting $1" "$t"
              echo "[GATE] could not start $1 on ${SHA}: the branch points at $t"
              return 1
            fi
            if gh workflow run "$1" --repo "$REPO" --ref "$BRANCH"; then
              echo "[GATE] $1 had no run on ${SHA}; started it on $BRANCH."
              return 0
            fi
            echo "[GATE] could not start $1"
            return 1
          }

          while :; do
            elapsed=$(( $(date +%s) - START ))
            now=$(date +%s)
            runs=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" 2>/dev/null \
                   || echo '{"workflow_runs":[]}')

            # --- gate 1: `Xcode Compile Check`, read by CONCLUSION. It builds
            # Sources/ alone and its conclusion is honest, unlike the pipeline's.
            if [ -z "$compile" ]; then
              compile=$(printf '%s' "$runs" | jq -r '
                [.workflow_runs[] | select(.name == "Xcode Compile Check")]
                | sort_by(.run_started_at) | last
                | select(. != null and .status == "completed")
                | .conclusion // empty')
              seen=$(printf '%s' "$runs" | jq -r '
                [.workflow_runs[] | select(.name == "Xcode Compile Check")] | length')
              if [ -z "$compile" ] && [ "$seen" = "0" ] && [ $(( now - compile_since )) -gt "$GRACE" ]; then
                if [ -z "$compile_sent" ] && dispatch xcode-compile-check.yml; then
                  compile_sent=yes; compile_since=$(date +%s)
                else
                  compile="never-ran"
                fi
              fi
            fi

            # --- gate 2: `Echoelmusic CI/CD Pipeline`, read by STEP. #396 makes
            # the RUN red on every push, so the run's own conclusion says nothing;
            # `Build for Testing` is the step that proves the test bundle compiles.
            # The matrix may hold several — every one of them must be success.
            if [ -z "$testbuild" ]; then
              ci=$(printf '%s' "$runs" | jq -r '
                [.workflow_runs[] | select(.name == "Echoelmusic CI/CD Pipeline")]
                | sort_by(.run_started_at) | last | .id // empty')
              ci_status=$(printf '%s' "$runs" | jq -r '
                [.workflow_runs[] | select(.name == "Echoelmusic CI/CD Pipeline")]
                | sort_by(.run_started_at) | last | .status // empty')
              if [ -n "$ci" ]; then
                jobs=$(gh api "repos/$REPO/actions/runs/$ci/jobs?per_page=100" 2>/dev/null \
                       || echo '{"jobs":[]}')
                testbuild=$(printf '%s' "$jobs" | jq -r '
                  [.jobs[].steps[]? | select(.name == "Build for Testing")] as $s
                  | if ($s | length) == 0 then empty
                    elif ($s | map(select(.conclusion == null)) | length) > 0 then empty
                    elif ($s | map(select(.conclusion != "success")) | length) > 0 then "failure"
                    else "success" end')
                # The run finished and the step never reported: an earlier job
                # failed and this one was skipped. Nothing was built.
                if [ -z "$testbuild" ] && [ "$ci_status" = "completed" ]; then
                  testbuild="never-ran"
                fi
              elif [ $(( now - ci_since )) -gt "$GRACE" ]; then
                if [ -z "$ci_sent" ] && dispatch ci.yml; then
                  ci_sent=yes; ci_since=$(date +%s)
                else
                  testbuild="never-ran"
                fi
              fi
            fi

            # --- gate 3: `Echoel Studio` (studio.yml), read by CONCLUSION — only when
            # the merge brings EchoelStudio/. It runs the three packages' tests on macOS,
            # builds them for iOS, and builds the app for the simulator and as a Release
            # device build; it has no continue-on-error, so its conclusion is honest.
            if [ -z "$studio" ]; then
              studio=$(printf '%s' "$runs" | jq -r '
                [.workflow_runs[] | select(.name == "Echoel Studio")]
                | sort_by(.run_started_at) | last
                | select(. != null and .status == "completed")
                | .conclusion // empty')
              sseen=$(printf '%s' "$runs" | jq -r '
                [.workflow_runs[] | select(.name == "Echoel Studio")] | length')
              if [ -z "$studio" ] && [ "$sseen" = "0" ] && [ $(( now - studio_since )) -gt "$GRACE" ]; then
                if [ -z "$studio_sent" ] && dispatch studio.yml; then
                  studio_sent=yes; studio_since=$(date +%s)
                else
                  studio="never-ran"
                fi
              fi
            fi

            echo "  t+${elapsed}s  compile=${compile:-pending}  build-for-testing=${testbuild:-pending}  studio=${studio:-pending}"
            if [ -n "$compile" ] && [ -n "$testbuild" ] && [ -n "$studio" ]; then break; fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              compile="${compile:-timeout}"
              testbuild="${testbuild:-timeout}"
              studio="${studio:-timeout}"
              break
            fi
            sleep 30
          done

          echo "compile_check=$compile" >> $GITHUB_OUTPUT
          echo "build_for_testing=$testbuild" >> $GITHUB_OUTPUT
          echo "studio=$studio" >> $GITHUB_OUTPUT
          echo ""
          ok=true
          if [ "$NEED_LEGACY" = "true" ]; then
            if [ "$compile" = "success" ] && [ "$testbuild" = "success" ]; then :; else ok=false; fi
          fi
          if [ "$NEED_STUDIO" = "true" ]; then
            if [ "$studio" = "success" ]; then :; else ok=false; fi
          fi
          if [ "$ok" = "true" ]; then
            echo "[OK] Every gate of a touched area is green. Merging."
          else
            # A red gate is this commit's own verdict and is reported as one. Only a gate
            # that was cancelled, never ran or timed out is checked against the branch: a
            # newer push cancels the older Studio run, and that push's job carries this
            # commit too.
            case "$compile $testbuild $studio" in
              *failure*) ;;
              *) t=$(tip); if [ -n "$t" ] && [ "$t" != "$SHA" ]; then superseded "gates $compile/$testbuild/$studio" "$t"; fi ;;
            esac
            echo "::error::REFUSING TO MERGE ${SHA}. Xcode Compile Check=${compile}; CI/CD step 'Build for Testing'=${testbuild}; Echoel Studio=${studio}. The commit stays on its branch — fix it there and push again. This is the repair of #683: before it, an unverified commit reached main anyway."
            exit 1
          fi

      - name: Merge to main
        # `superseded`: the branch moved on while the gates ran; the newer push's job
        # merges this commit with it, so this job must not merge an older, partly
        # unverified tip.
        if: steps.fetch.outputs.commit_exists == 'true' && steps.gates.outputs.superseded != 'true'
        id: merge
        run: |
          echo "=============================================="
          echo "  MERGING CHANGES TO MAIN"
          echo "=============================================="

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Current branch: $(git branch --show-current)"
          echo "Current HEAD: $(git rev-parse HEAD)"
          echo "Target commit: ${{ github.sha }}"

          # Show what we're merging
          echo ""
          echo "Files changed:"
          git diff --name-only HEAD..${{ github.sha }} 2>/dev/null || echo "(could not diff)"
          echo ""

          # RETRIED, because the gate above can hold this job for up to 45
          # minutes and `main` may have moved meanwhile (the docs auto-merge, or
          # a branch that finished first). Before #1405 this job took seconds and
          # a stale checkout was not a realistic failure; now it is the ordinary
          # case. Each attempt re-reads `main`, so the merge is always computed
          # against what is actually there.
          # Eight attempts, a few seconds apart and growing (2026-10-31): with one concurrency
          # group per branch, several branches can finish their gates in the same minute, and
          # each lost race to `main` costs one attempt. A merge attempt takes seconds.
          merged=""
          for attempt in 1 2 3 4 5 6 7 8; do
            echo ""
            echo "--- attempt $attempt ---"
            git fetch origin main
            git reset --hard origin/main

            if ! git merge ${{ github.sha }} --no-edit \
                 -m "fix: auto-merge from ${{ github.ref_name }}"; then
              echo "merge_status=conflict" >> $GITHUB_OUTPUT
              echo "[ERROR] Merge failed - conflicts detected"
              git merge --abort 2>/dev/null || true
              exit 1
            fi

            echo "Merge successful, pushing to main..."
            echo "New HEAD: $(git rev-parse HEAD)"
            if git push origin main 2>&1; then
              merged="yes"
              break
            fi
            echo "[WARN] Push rejected — main moved. Re-reading and retrying."
            sleep $(( attempt * 5 + RANDOM % 7 ))
          done

          if [ -n "$merged" ]; then
            echo "merge_status=success" >> $GITHUB_OUTPUT
            echo "[OK] Pushed to main successfully!"
          else
            echo "merge_status=push_failed" >> $GITHUB_OUTPUT
            echo "[ERROR] Push to main failed eight times"
            exit 1
          fi

      - name: Trigger TestFlight
        id: testflight
        # DISABLED 2026-06-16: dispatching testflight.yml with platform=all on every
        # merge uploaded all Apple platforms per push and exhausted Apple's daily
        # TestFlight upload quota (and raced Fastlane cert revocation). Deploy
        # intentionally instead: `git push origin HEAD:deploy` (deploy-on-tag.yml).
        if: false
        uses: actions/github-script@v7
        with:
          script: |
            console.log('Merge successful! Triggering TestFlight for all platforms...');

            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'testflight.yml',
                ref: 'main',
                inputs: {
                  platform: 'all',
                  clean_build: 'false'
                }
              });
              console.log('TestFlight workflow dispatched successfully!');
            } catch (error) {
              console.log(`Failed to dispatch TestFlight: ${error.message}`);
              console.log('You may need to trigger TestFlight manually from the Actions tab.');
            }

      - name: Summary
        if: always()
        run: |
          echo "## Auto-Merge Claude Branch" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Pushed Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Source Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit Found | ${{ steps.fetch.outputs.commit_exists == 'true' && 'Yes' || 'No' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Changes code | ${{ steps.scope.outputs.touches_code || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Xcode Compile Check | ${{ steps.gates.outputs.compile_check || 'not required' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CI/CD Build for Testing | ${{ steps.gates.outputs.build_for_testing || 'not required' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Echoel Studio | ${{ steps.gates.outputs.studio || 'not required' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Superseded by a newer push | ${{ steps.gates.outputs.superseded == 'true' && 'yes (not merged here)' || 'no' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Merge Status | ${{ steps.merge.outputs.merge_status || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          # ⛔ #1405b — THIS ROW SAID `Dispatched` ON EVERY SUCCESSFUL MERGE AND THE DISPATCH HAS
          # NOT RUN SINCE 2026-06-16. It read `steps.merge.outputs.merge_status`, i.e. it reported
          # whether the MERGE worked and printed a sentence about TESTFLIGHT — so the one step in
          # this workflow that is switched off was the one the Summary called done. Found by
          # reading the Summary of #1405's own first run, which is the only reason it surfaced.
          #
          # It now reads the step's OWN outcome, which needs the `id:` added above. `skipped` while
          # `if: false` holds, `success`/`failure` the day the founder flips it — honest in both
          # states, which a hard-coded "Disabled" would not be. This is `doctor` Section A's rule
          # one level down: a watcher on `steps.<id>.outcome` is only possible once the step has an
          # id, and a Summary that cannot be wrong is worth more than one that is usually right.
          echo "| TestFlight | ${{ steps.testflight.outcome }} |" >> $GITHUB_STEP_SUMMARY
