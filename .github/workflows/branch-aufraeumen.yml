name: Branch-Aufraeumen
on:
  workflow_dispatch:
    inputs:
      modus:
        description: "PROBE = nur anzeigen, LOESCHEN = wirklich loeschen"
        required: true
        default: PROBE
permissions:
  contents: write
jobs:
  aufraeumen:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MODUS: ${{ inputs.modus }}
          STICHTAG: "2026-11-05T09:42:03Z"
        run: |
          n=0; b=0
          for name in $(gh api "repos/$REPO/branches?per_page=100" --paginate --jq '.[].name'); do
            case "$name" in main|claude/new-session-0bs5lg|claude/fwd-07828d|claude/umzug-*) b=$((b+1)); continue;; esac
            d=$(gh api "repos/$REPO/commits/$(gh api "repos/$REPO/git/ref/heads/$name" --jq .object.sha)" --jq .commit.committer.date)
            if [ "$d" \> "$STICHTAG" ]; then echo "BLEIBT $name"; b=$((b+1)); continue; fi
            if [ "$MODUS" = "LOESCHEN" ]; then gh api -X DELETE "repos/$REPO/git/refs/heads/$name" && echo "GELOESCHT $name"; else echo "WUERDE LOESCHEN $name"; fi
            n=$((n+1))
          done
          echo "### $MODUS: $n geloescht/wuerde, $b bleiben" >> "$GITHUB_STEP_SUMMARY"
