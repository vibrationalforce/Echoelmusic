name: Website-Pruefung
on:
  workflow_dispatch:
    inputs:
      modus:
        description: "PRUEFEN = nur anzeigen; AUFRAEUMEN = alte Cloudflare-Deployments loeschen und Workers-Vorschauen aus"
        type: choice
        options: [PRUEFEN, AUFRAEUMEN]
        default: PRUEFEN
permissions: {}
concurrency: { group: website-pruefung }
jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { shell: bash } }
    steps:
      - name: Live-Pruefung (gibt keinen Seiteninhalt aus)
        run: |
          S="$GITHUB_STEP_SUMMARY"; B="$RUNNER_TEMP/b"; echo "### Live" >> "$S"
          for u in https://echoelmusic.com/dev/GLOSSARY.md https://echoelmusic.com/dev/FEATURE_STATUS.md \
                   https://echoelmusic.com/CLAUDE.md https://echoelmusic.com/hilfe https://echoelmusic.com/ \
                   https://echoelmusic.pages.dev/dev/GLOSSARY.md \
                   https://echoelmusic.vibrationalforce.workers.dev/dev/GLOSSARY.md; do
            : > "$B"
            r=$(curl -s -o "$B" -w '%{http_code} %{num_redirects} %{url_effective}' -L --max-time 20 "$u") || r="$r curl=$?"
            k=$(head -c 2 "$B" | tr -dc '<#!a-zA-Z'); echo "- \`$r\` Anfang=\`${k:--}\` <- $u" | tee -a "$S"
          done
          curl -sI --max-time 20 https://echoelmusic.com/ | tr -d '\r' | grep -iE '^(server|cf-ray|x-github-request-id|x-served-by):' | sed 's/^/- /' | tee -a "$S" || true
      - name: Cloudflare
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          MODUS: ${{ inputs.modus }}
          ACC: "779f9c40a138d93389a3b1d8527ea5a8"
          PROJ: echoelmusic
          WORKER: echoelmusic
          STICHTAG: "2026-11-05T11:35:00Z"
        run: |
          S="$GITHUB_STEP_SUMMARY"; I="$RUNNER_TEMP/ids"; D="$RUNNER_TEMP/del"; echo "### Cloudflare ($MODUS)" >> "$S"
          if [ -z "$CF_TOKEN" ]; then echo "- Kein Cloudflare-Secret gesetzt" | tee -a "$S"; exit 0; fi
          A=https://api.cloudflare.com/client/v4
          api() { curl -s --max-time 30 -H "Authorization: Bearer $CF_TOKEN" "$@"; }
          j() { jq -c "$1" 2>/dev/null || echo "keine JSON-Antwort"; }
          echo "- Token (Konto): $(api "$A/accounts/$ACC/tokens/verify" | j '{success, status: .result.status}')" | tee -a "$S"
          echo "- Token (Nutzer): $(api "$A/user/tokens/verify" | j '{success, status: .result.status}')" | tee -a "$S"
          P=$(api "$A/accounts/$ACC/pages/projects/$PROJ") || { echo "- Projekt: curl-Fehler" | tee -a "$S"; exit 1; }
          echo "- Pages-Projekt: $(echo "$P" | j '{success, fehler: [.errors[]?.code], quelle: .result.source.type, aktuell: .result.canonical_deployment.id, aktuell_seit: .result.canonical_deployment.created_on}')" | tee -a "$S"
          OK=$(echo "$P" | jq -r '.success' 2>/dev/null) || OK=false
          KEEP=$(echo "$P" | jq -r '.result.canonical_deployment.id // empty' 2>/dev/null) || KEEP=""
          SEIT=$(echo "$P" | jq -r '.result.canonical_deployment.created_on // empty' 2>/dev/null) || SEIT=""
          if [ "$OK" != "true" ] || [ -z "$KEEP" ]; then
            echo "- Kein Zugriff auf das Pages-Projekt (Token braucht 'Cloudflare Pages: Edit')" | tee -a "$S"
            [ "$MODUS" = "AUFRAEUMEN" ] && exit 1; exit 0
          fi
          [[ "$SEIT" < "$STICHTAG" ]] && echo "- ⚠️ Das aktuelle Produktions-Deployment ist aelter als die Sperre — erst neu deployen" | tee -a "$S"
          : > "$I"; page=1
          while [ $page -le 400 ]; do
            R=$(api "$A/accounts/$ACC/pages/projects/$PROJ/deployments?per_page=25&page=$page") || { echo "- Seite $page: curl-Fehler, Liste unvollstaendig, nichts geloescht" | tee -a "$S"; exit 1; }
            n=$(echo "$R" | jq -r 'if .success == true and (.result | type) == "array" then (.result | length) else "FEHLER" end' 2>/dev/null) || n=FEHLER
            case "$n" in ''|*[!0-9]*) echo "- Seite $page: $(echo "$R" | j '[.errors[]?.message]'), Liste unvollstaendig, nichts geloescht" | tee -a "$S"; exit 1;; esac
            [ "$n" -eq 0 ] && break
            echo "$R" | jq -r '.result[] | [.id, .environment, .created_on] | @tsv' >> "$I"
            page=$((page+1))
          done
          sort -u -o "$I" "$I"
          alt() { awk -F'\t' -v t="$STICHTAG" -v k="$KEEP" '$1 ~ /^[0-9a-f-]+$/ && $3 != "" && $3 < t && $1 != k'; }
          echo "- Deployments gesamt: $(wc -l < "$I"); vor der Sperre (ohne aktuelles): $(alt < "$I" | wc -l), davon Produktion: $(alt < "$I" | awk -F'\t' '$2=="production"' | wc -l)" | tee -a "$S"
          W=$(api "$A/accounts/$ACC/workers/scripts/$WORKER/subdomain")
          echo "- Workers-Adressen: $(echo "$W" | j '{success, fehler: [.errors[]?.code], enabled: .result.enabled, vorschauen: .result.previews_enabled}')" | tee -a "$S"
          if [ "$MODUS" != "AUFRAEUMEN" ]; then echo "- Nur Pruefung, nichts geaendert" | tee -a "$S"; exit 0; fi
          : > "$D"
          alt < "$I" | cut -f1 | while read -r id; do
            R=$(api -X DELETE "$A/accounts/$ACC/pages/projects/$PROJ/deployments/$id?force=true") || R='{}'
            if echo "$R" | jq -e '.success == true' >/dev/null 2>&1; then echo "ok" >> "$D"; else echo "fehler $(echo "$R" | j '[.errors[]?.code]')" >> "$D"; fi
          done
          echo "- Geloescht: $(grep -c '^ok' "$D" || true), Fehler: $(grep -c '^fehler' "$D" || true) $(grep '^fehler' "$D" | sort | uniq -c | head -3 | tr '\n' ' ')" | tee -a "$S"
          EN=$(echo "$W" | jq -r '.result.enabled // empty' 2>/dev/null) || EN=""
          if [ -n "$EN" ]; then
            V=$(api -X POST -H "Content-Type: application/json" --data "{\"enabled\": $EN, \"previews_enabled\": false}" "$A/accounts/$ACC/workers/scripts/$WORKER/subdomain")
            echo "- Workers-Vorschauen aus: $(echo "$V" | j '{success, fehler: [.errors[]?.code], vorschauen: .result.previews_enabled}')" | tee -a "$S"
          fi
          if grep -q '^fehler' "$D"; then exit 1; fi
