name: Echoel Studio (Linux)

# The portability claim as a measurement, not a sentence. EchoelCore and EchoelDSP
# import Foundation only (Core also Observation), so they should build and test on a
# Linux toolchain; this job is the proof or the refutation. It is its own workflow on
# purpose: a red here is a finding about Linux, and it must not hide inside the macOS
# run (studio.yml) nor block it. EchoelEngine is NOT in this job: it binds AVFoundation
# and AudioToolbox in four files (AUv3 hosting, sample files) and is split into a
# portable part and an Apple adapter first (docs/dev/NEUPLANUNG_2026-10-18.md, P0).
#
# Context: docs/dev/FOERDERUNG_PROTOTYPE_FUND_2026.md §7.1 Frage 4/5 and §9 action 5.

on:
  push:
    paths:
      - 'EchoelStudio/Core/**'
      - 'EchoelStudio/DSP/**'
      - '.github/workflows/studio-linux.yml'
  pull_request:
    paths:
      - 'EchoelStudio/Core/**'
      - 'EchoelStudio/DSP/**'
      - '.github/workflows/studio-linux.yml'
  workflow_dispatch:

concurrency:
  group: studio-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Core + DSP on Linux
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 20
    # Inside a container the default step shell is `sh` (dash), where `set -o pipefail` is an
    # illegal option — run #1 died on that line before the first swift command. Bash it is.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      # Three measurements in the order that keeps the most information when one is red:
      # does Core COMPILE on Linux (sources + tests), does DSP build and pass, does Core pass.
      # Run #2 (2026-10-19) answered the first with yes (Swift 6.2.4) and then died inside
      # XCTest's test DISCOVERY (`__allTests` → `_arrayForceCast` → swift_dynamicCastFailure),
      # before any Core test ran — with `swift test` first, DSP never got measured at all.
      - name: Build Core incl. tests (Linux)
        run: |
          set -o pipefail
          swift build --build-tests --package-path EchoelStudio/Core 2>&1 | tee core-build-linux.log

      - name: Test DSP (Linux)
        run: |
          set -o pipefail
          swift test --package-path EchoelStudio/DSP 2>&1 | tee dsp-linux.log

      - name: Test Core (Linux)
        run: |
          set -o pipefail
          swift test --package-path EchoelStudio/Core 2>&1 | tee core-linux.log

      - name: Print logs on failure
        if: failure()
        run: |
          grep -n "error:" core-build-linux.log | head -40 || true
          tail -120 dsp-linux.log || true
          tail -120 core-linux.log || true
