name: Echoel Studio

# The restart (docs/dev/NEUSTART_2026-10-17.md). Builds and tests everything under
# EchoelStudio/ on its own, so the legacy app and its guards cannot interfere with it and
# it cannot interfere with them.

on:
  push:
    paths:
      - 'EchoelStudio/**'
      - '.github/workflows/studio.yml'
  pull_request:
    paths:
      - 'EchoelStudio/**'
      - '.github/workflows/studio.yml'
  workflow_dispatch:

concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: '26.2'

jobs:
  core:
    name: EchoelCore
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test (macOS host)
        run: |
          set -o pipefail
          swift test --package-path EchoelStudio/Core 2>&1 | tee core-test.log

      - name: Build for iOS
        working-directory: EchoelStudio/Core
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme EchoelCore \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ../../core-ios.log | tail -40

      - name: Print logs on failure
        if: failure()
        run: |
          tail -150 core-test.log || true
          grep -n "error:" core-ios.log | head -60 || true
