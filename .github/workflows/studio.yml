name: Echoel Studio

# The restart (docs/dev/NEUSTART_2026-10-17.md). Builds and tests everything under
# EchoelStudio/ on its own, so the legacy app and its guards cannot interfere with it and
# it cannot interfere with them.

on:
  push:
    paths:
      - 'EchoelStudio/**'
      - '.github/workflows/studio.yml'
  pull_request:
    paths:
      - 'EchoelStudio/**'
      - '.github/workflows/studio.yml'
  workflow_dispatch:

concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: '26.2'

jobs:
  core:
    name: Core + DSP + Engine
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The trust promise "no tracking, network only where named" as a check, not a sentence
      # (docs/dev/NEUPLANUNG_2026-10-18.md §2 Vertrauen). Every network API in EchoelStudio's
      # sources must sit in one of the files listed here; a new one fails until it is added on
      # purpose, which is the moment to say what it sends and that it is off by default.
      - name: Network only where named
        run: |
          allowed='EchoelStudio/App/Store/StoreController.swift
          EchoelStudio/App/Store/StoreView.swift
          EchoelStudio/Plugins/Shared/PluginLicense.swift
          EchoelStudio/App/Engine/MIDIInput.swift'
          found=$(git grep -lE '^[[:space:]]*import (Network|StoreKit|MultipeerConnectivity|CloudKit|WebKit|SafariServices)|URLSession|NWConnection|NWListener|NWBrowser|MIDINetworkSession|URLRequest' \
                  -- 'EchoelStudio/*.swift' ':!EchoelStudio/**/Tests/**' | sort -u)
          bad=$(comm -23 <(printf '%s\n' "$found") <(printf '%s\n' "$allowed" | sed 's/^ *//' | sort -u) | sed '/^$/d')
          if [ -n "$bad" ]; then
            echo "::error::Network API outside the named files:"; echo "$bad"; exit 1
          fi
          echo "Network APIs only in:"; echo "$found"

      # The module layering as a check (S-26 D4.2, docs/dev/NEUPLANUNG_2026-10-18.md §3.4): each
      # library imports only what its row names, and the AUv3 extension never imports the engine.
      # SwiftPM target dependencies already refuse an undeclared package module; this step also
      # catches an Apple framework (AVFoundation in a kernel) and a bare `import EchoelEngine` in
      # Plugins/, which Xcode's shared module directory can let compile. A new import fails here
      # until its row is widened on purpose. Not a test (Law 8: tests do not read source).
      - name: Imports only where named
        run: |
          modules() {
            git grep -hE '^[[:space:]]*(@[A-Za-z]+[[:space:]]+)*import[[:space:]]' -- "$1/*.swift" \
              | sed -E 's/^[[:space:]]*(@[A-Za-z]+[[:space:]]+)*import[[:space:]]+((typealias|struct|class|enum|protocol|let|var|func)[[:space:]]+)?([A-Za-z_][A-Za-z0-9_]*).*/\4/' \
              | sort -u
          }
          fail=0
          check() {
            dir=$1; shift
            found=$(modules "$dir")
            if [ -z "$found" ]; then echo "::error::no import found under $dir — the scan matches nothing"; fail=1; return; fi
            bad=$(comm -23 <(printf '%s\n' "$found") <(printf '%s\n' "$@" | sort -u) | sed '/^$/d')
            if [ -n "$bad" ]; then echo "::error::$dir imports outside its row: $(echo $bad)"; fail=1; fi
            echo "$dir: $(echo $found)"
          }
          check EchoelStudio/Core/Sources Foundation Observation
          check EchoelStudio/DSP/Sources Foundation
          check EchoelStudio/Engine/Sources/EchoelKernels Foundation Synchronization EchoelCore EchoelDSP
          check EchoelStudio/Engine/Sources/EchoelEngine Foundation Synchronization EchoelCore EchoelDSP EchoelKernels
          check EchoelStudio/Engine/Sources/EchoelHost Foundation Synchronization EchoelCore EchoelKernels AVFoundation AudioToolbox
          stray=$(git grep -nE '^[[:space:]]*(@[A-Za-z]+[[:space:]]+)*import[[:space:]]+EchoelEngine([^A-Za-z0-9_]|$)' -- 'EchoelStudio/Plugins/*.swift' || true)
          if [ -n "$stray" ]; then echo "::error::the AUv3 extension imports the engine:"; echo "$stray"; fail=1; fi
          exit $fail

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test (macOS host)
        run: |
          set -o pipefail
          swift test --package-path EchoelStudio/Core 2>&1 | tee core-test.log

      - name: Test DSP (macOS host)
        run: |
          set -o pipefail
          swift test --package-path EchoelStudio/DSP 2>&1 | tee dsp-test.log

      - name: Build DSP for iOS
        working-directory: EchoelStudio/DSP
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme EchoelDSP \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ../../dsp-ios.log | tail -40

      - name: Test Engine (macOS host)
        run: |
          set -o pipefail
          swift test --package-path EchoelStudio/Engine 2>&1 | tee engine-test.log

      - name: Build Engine for iOS
        working-directory: EchoelStudio/Engine
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme EchoelEngine \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ../../engine-ios.log | tail -40

      - name: Build for iOS
        working-directory: EchoelStudio/Core
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme EchoelCore \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ../../core-ios.log | tail -40

      - name: Print logs on failure
        if: failure()
        run: |
          tail -150 core-test.log || true
          tail -150 dsp-test.log || true
          tail -150 engine-test.log || true
          grep -n "error:" core-ios.log dsp-ios.log engine-ios.log | head -60 || true

  app:
    name: App (iPhone + iPad)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Setup XcodeGen
        uses: ./.github/actions/setup-xcodegen
        with:
          version: '2.42.0'

      # A fresh runner's first simulator boot spends minutes on data migration (run 170: 5 min
      # 58 s), so it starts here and runs while the app builds.
      - name: Boot a simulator (in the background)
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json, sys; d = json.load(sys.stdin)['devices']; print(next(x['udid'] for r, l in d.items() if 'iOS' in r for x in l if x['name'].startswith('iPhone')))")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true

      - name: Generate project
        run: xcodegen generate --spec EchoelStudio/project.yml

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project EchoelStudio/EchoelStudio.xcodeproj \
            -scheme EchoelStudio \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee app-sim.log | tail -30

      # The extension links no engine code (S-26 D4.2). Read from the built Mach-O files, not the
      # project: a mangled Swift name carries its module as <length><name> (`12EchoelEngine`), in
      # symbols and in reflection metadata alike. Two positive controls keep the needle honest —
      # the extension must carry `13EchoelKernels` and the app must carry `12EchoelEngine`; if
      # either is missing, the check could not have seen the thing it forbids.
      - name: Extension carries no engine code
        run: |
          set -euo pipefail
          APP=$(find build/sim/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          EXT="$APP/PlugIns/EchoelPlugins.appex"
          test -d "$EXT" || { echo "::error::no EchoelPlugins.appex in the simulator build"; exit 1; }
          scan() {
            while IFS= read -r f; do
              file -b "$f" | grep -q 'Mach-O' || continue
              if LC_ALL=C grep -a -q "$1" "$f"; then echo "$f"; fi
            done
          }
          ext_engine=$(find "$EXT" -type f | scan '12EchoelEngine')
          ext_kernels=$(find "$EXT" -type f | scan '13EchoelKernels')
          app_engine=$(find "$APP" -path "$APP/PlugIns" -prune -o -type f -print | scan '12EchoelEngine')
          [ -n "$ext_kernels" ] || { echo "::error::needle broken: no EchoelKernels name in the extension"; exit 1; }
          [ -n "$app_engine" ] || { echo "::error::needle broken: no EchoelEngine name in the app"; exit 1; }
          if [ -n "$ext_engine" ]; then
            echo "::error::the AUv3 extension contains EchoelEngine code:"; echo "$ext_engine"; exit 1
          fi
          echo "extension: EchoelKernels in $(echo $ext_kernels | wc -w) file(s), EchoelEngine in none"
          echo "app: EchoelEngine in $(echo $app_engine | wc -w) file(s)"

      # A crash at launch must not reach TestFlight (ultra-audit R7): the simulator build is
      # installed and launched, and must still be running 20 s later — past restore(), the audio
      # start and the 10-s launch confirmation. The check installs a COPY without the AUv3
      # extension: an unsigned .appex gets no install placeholder ("Invalid placeholder
      # attributes", run 170), and the app does not need it to start. The extension is checked
      # where it ships, by studio-testflight.yml.
      - name: Launch smoke (iOS Simulator)
        run: |
          set -euo pipefail
          BUILT=$(find build/sim/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          test -n "$BUILT" || { echo "::error::no .app in the simulator build"; exit 1; }
          mkdir -p build/smoke
          APP="build/smoke/$(basename "$BUILT")"
          rm -rf "$APP"
          cp -R "$BUILT" "$APP"
          rm -rf "$APP/PlugIns"
          UDID="$SIM_UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          PID=$(xcrun simctl launch "$UDID" "$BUNDLE" | awk '{print $NF}')
          echo "launched $BUNDLE as pid $PID"
          sleep 20
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::Echoel Studio did not survive 20 s after launch"
            ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | head -5 || true
            exit 1
          fi
          echo "still running 20 s after launch"
          xcrun simctl terminate "$UDID" "$BUNDLE" || true

      - name: Build for iOS device (Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project EchoelStudio/EchoelStudio.xcodeproj \
            -scheme EchoelStudio \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee app-device.log | tail -30

      - name: Print errors on failure
        if: failure()
        run: |
          grep -n "error:" app-sim.log app-device.log | head -80 || true
