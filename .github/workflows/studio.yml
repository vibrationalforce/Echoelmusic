name: Echoel Studio

# The restart (docs/dev/NEUSTART_2026-10-17.md). Builds and tests everything under
# EchoelStudio/ on its own, so the legacy app and its guards cannot interfere with it and
# it cannot interfere with them.

on:
  push:
    paths:
      - 'EchoelStudio/**'
      - '.github/workflows/studio.yml'
  pull_request:
    paths:
      - 'EchoelStudio/**'
      - '.github/workflows/studio.yml'
  workflow_dispatch:

concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: '26.2'

jobs:
  core:
    name: Core + DSP + Engine
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The trust promise "no tracking, network only where named" as a check, not a sentence
      # (docs/dev/NEUPLANUNG_2026-10-18.md §2 Vertrauen). Every network API in EchoelStudio's
      # sources must sit in one of the files listed here; a new one fails until it is added on
      # purpose, which is the moment to say what it sends and that it is off by default.
      - name: Network only where named
        run: |
          allowed='EchoelStudio/App/Store/StoreController.swift
          EchoelStudio/App/Store/StoreView.swift
          EchoelStudio/Plugins/Shared/PluginLicense.swift
          EchoelStudio/App/Engine/MIDIInput.swift'
          found=$(git grep -lE '^[[:space:]]*import (Network|StoreKit|MultipeerConnectivity|CloudKit|WebKit|SafariServices)|URLSession|NWConnection|NWListener|NWBrowser|MIDINetworkSession|URLRequest' \
                  -- 'EchoelStudio/*.swift' ':!EchoelStudio/**/Tests/**' | sort -u)
          bad=$(comm -23 <(printf '%s\n' "$found") <(printf '%s\n' "$allowed" | sed 's/^ *//' | sort -u) | sed '/^$/d')
          if [ -n "$bad" ]; then
            echo "::error::Network API outside the named files:"; echo "$bad"; exit 1
          fi
          echo "Network APIs only in:"; echo "$found"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test (macOS host)
        run: |
          set -o pipefail
          swift test --package-path EchoelStudio/Core 2>&1 | tee core-test.log

      - name: Test DSP (macOS host)
        run: |
          set -o pipefail
          swift test --package-path EchoelStudio/DSP 2>&1 | tee dsp-test.log

      - name: Build DSP for iOS
        working-directory: EchoelStudio/DSP
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme EchoelDSP \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ../../dsp-ios.log | tail -40

      - name: Test Engine (macOS host)
        run: |
          set -o pipefail
          swift test --package-path EchoelStudio/Engine 2>&1 | tee engine-test.log

      - name: Build Engine for iOS
        working-directory: EchoelStudio/Engine
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme EchoelEngine \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ../../engine-ios.log | tail -40

      - name: Build for iOS
        working-directory: EchoelStudio/Core
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme EchoelCore \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ../../core-ios.log | tail -40

      - name: Print logs on failure
        if: failure()
        run: |
          tail -150 core-test.log || true
          tail -150 dsp-test.log || true
          tail -150 engine-test.log || true
          grep -n "error:" core-ios.log dsp-ios.log engine-ios.log | head -60 || true

  app:
    name: App (iPhone + iPad)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Setup XcodeGen
        uses: ./.github/actions/setup-xcodegen
        with:
          version: '2.42.0'

      - name: Generate project
        run: xcodegen generate --spec EchoelStudio/project.yml

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project EchoelStudio/EchoelStudio.xcodeproj \
            -scheme EchoelStudio \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee app-sim.log | tail -30

      - name: Build for iOS device (Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project EchoelStudio/EchoelStudio.xcodeproj \
            -scheme EchoelStudio \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee app-device.log | tail -30

      - name: Print errors on failure
        if: failure()
        run: |
          grep -n "error:" app-sim.log app-device.log | head -80 || true
