# XcodeGen spec for Echoel Studio (docs/dev/NEUSTART_2026-10-17.md).
# Separate from the legacy root project.yml on purpose: nothing here can disturb the old
# app's build or guards, and nothing there can disturb this one.
#
#   xcodegen generate --spec EchoelStudio/project.yml
#
# The bundle id is a development id until the swap (M1), when this app takes over
# com.echoelmusic.app and its App Store record.

name: EchoelStudio

options:
  bundleIdPrefix: com.echoelmusic
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  EchoelCore:
    path: Core
  EchoelDSP:
    path: DSP
  EchoelEngine:
    path: Engine

targets:
  EchoelStudio:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: EchoelCore
      - package: EchoelDSP
      - package: EchoelEngine
      # Our own Audio Units ship inside the app (PlugIns/); they are sold as in-app purchases.
      - target: EchoelSynth
      - target: EchoelDrums
      - target: EchoelSampler
      - target: EchoelEffects
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.echoelmusic.studio
        PRODUCT_NAME: Echoel
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Echoel
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIBackgroundModes: audio
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Echoel records your microphone or audio interface onto the audio track you arm."
        # Network MIDI (CoreMIDI's RTP-MIDI session): the prompt shows the first time it is
        # turned on. NSBonjourServices is an array, which the generated plist cannot carry, so
        # it comes from the small Info.plist below and the two are merged.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Echoel sends and receives MIDI over your local network when you turn on Network MIDI."
        INFOPLIST_FILE: Support/Info.plist
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        CODE_SIGN_STYLE: Automatic

  # Echoel Synth — the studio's synth as an AUv3 instrument (aumu 'eSyn' 'Echo') for other apps.
  # Lessons from the legacy AUv3 (root project.yml): AudioComponents under
  # NSExtensionAttributes, a synchronous nonisolated AUAudioUnitFactory, NO App Group
  # entitlement (it made every host fail with -3000 when the App ID lacked it), and explicit
  # SDKROOT/SUPPORTED_PLATFORMS so the extension builds for iOS only.
  EchoelSynth:
    type: app-extension
    platform: iOS
    sources:
      - path: Plugins/Synth
        excludes:
          - "Info.plist"
      - path: Plugins/Shared
    dependencies:
      - package: EchoelCore
      - package: EchoelDSP
      - package: EchoelEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.echoelmusic.studio.synth
        PRODUCT_NAME: EchoelSynth
        INFOPLIST_FILE: Plugins/Synth/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic

  # Echoel Drums — the studio's synthesized kit as an AUv3 instrument (aumu 'eDrm' 'Echo'),
  # General MIDI drum map. Same lessons as EchoelSynth above; same shared unit class.
  EchoelDrums:
    type: app-extension
    platform: iOS
    sources:
      - path: Plugins/Drums
        excludes:
          - "Info.plist"
      - path: Plugins/Shared
    dependencies:
      - package: EchoelCore
      - package: EchoelDSP
      - package: EchoelEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.echoelmusic.studio.drums
        PRODUCT_NAME: EchoelDrums
        INFOPLIST_FILE: Plugins/Drums/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic

  # Echoel Sampler — load a sample, play it across the keys (aumu 'eSmp' 'Echo'). The sample
  # travels in the unit's fullState, so a host session brings it back.
  EchoelSampler:
    type: app-extension
    platform: iOS
    sources:
      - path: Plugins/Sampler
        excludes:
          - "Info.plist"
      - path: Plugins/Shared
    dependencies:
      - package: EchoelCore
      - package: EchoelDSP
      - package: EchoelEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.echoelmusic.studio.sampler
        PRODUCT_NAME: EchoelSampler
        INFOPLIST_FILE: Plugins/Sampler/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic

  # Echoel Effects — the four standard effects (aufx 'xEQ5' 'xCmp' 'xDly' 'xRvb' 'Echo') for
  # other apps, one in-app purchase. Same lessons as EchoelSynth above. In Echoel itself the
  # effects stay free under their own ids (eEQ5 …), registered in-process.
  EchoelEffects:
    type: app-extension
    platform: iOS
    sources:
      - path: Plugins/Effects
        excludes:
          - "Info.plist"
      - path: Plugins/Shared
    dependencies:
      - package: EchoelCore
      - package: EchoelDSP
      - package: EchoelEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.echoelmusic.studio.effects
        PRODUCT_NAME: EchoelEffects
        INFOPLIST_FILE: Plugins/Effects/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
