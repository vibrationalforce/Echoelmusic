# XcodeGen spec for Echoel Studio (docs/dev/NEUSTART_2026-10-17.md).
# Separate from the legacy root project.yml on purpose: nothing here can disturb the old
# app's build or guards, and nothing there can disturb this one.
#
#   xcodegen generate --spec EchoelStudio/project.yml
#
# Identity: this app IS com.echoelmusic.app (App Store record 6757957358) and its one
# extension is com.echoelmusic.app.auv3 — the identifiers already registered in the developer
# portal. Nothing here needs a new bundle id, app record or App ID (audit 2026-10-18).

name: EchoelStudio

options:
  bundleIdPrefix: com.echoelmusic
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # One version for the app and its extension (App Store Connect rejects a mismatch). The
    # record already shipped 10.79.x builds to TestFlight, so this one must be higher. The build
    # number is set by the release workflow, which replaces the literal below with the run number.
    MARKETING_VERSION: "11.0.0"
    CURRENT_PROJECT_VERSION: "${BUILD_NUMBER:=1}"

packages:
  EchoelCore:
    path: Core
  EchoelDSP:
    path: DSP
  EchoelEngine:
    path: Engine
  # The first package from outside (wave W14, conductor 2026-10-29): HaishinKit, BSD-3, for live
  # streams over RTMP, RTMPS and SRT. Pinned exactly; the app takes three of its products, the
  # extension none. Its own dependencies (Logboard, BSD-3; the libsrt xcframework, MPL-2.0, the SRT
  # library as Haivision publishes it) come with it. Imported only under App/Streaming/ (studio.yml).
  HaishinKit:
    url: https://github.com/HaishinKit/HaishinKit.swift
    exactVersion: 2.2.5

targets:
  EchoelStudio:
    type: application
    platform: iOS
    sources:
      - path: App
      # The purchase id and name, shared with the extension by compiling the ONE file into both
      # targets; it is not in EchoelCore because the open packages do not know that anything is sold.
      - path: Plugins/Shared/PluginUnlock.swift
      - path: Support/App/PrivacyInfo.xcprivacy
        type: file
        buildPhase: resources
    dependencies:
      - package: EchoelCore
      - package: EchoelDSP
      - package: EchoelEngine
      # The kernels and the hosting protocols, a second library of the Engine package.
      - package: EchoelEngine
        product: EchoelKernels
      # The Audio Unit side (hosted units, our own effect unit, sample files), a third library.
      - package: EchoelEngine
        product: EchoelHost
      # Live streaming (W14): the core, RTMP/RTMPS and SRT. Never a dependency of the extension.
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: RTMPHaishinKit
      - package: HaishinKit
        product: SRTHaishinKit
      # Our own Audio Units ship inside the app (PlugIns/); they are sold as in-app purchases.
      - target: EchoelPlugins
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.echoelmusic.app
        PRODUCT_NAME: Echoel
        # The libsrt xcframework HaishinKit's SRT links has no Intel simulator slice, so the app's
        # simulator build is Apple silicon only (every CI runner and current Mac). Devices: arm64 as ever.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Echoel
        # The earlier app's icon, one 1024 image (Xcode draws every size from it).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIBackgroundModes: audio
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Echoel reads the heart rate of a Bluetooth chest strap when you turn the strap on as a body source."
        INFOPLIST_KEY_NSCameraUsageDescription: "Echoel measures your pulse from the rear camera when you choose Camera as a body source, and films a video take when you record one. Pulse frames are never stored; a take is saved only in your song, and nothing leaves the device."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Echoel saves a video you export to your photo library when you choose Save Video."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Echoel records your microphone or audio interface onto the audio track you arm."
        # Network MIDI (CoreMIDI's RTP-MIDI session): the prompt shows the first time it is
        # turned on. NSBonjourServices is an array, which the generated plist cannot carry, so
        # it comes from the small Info.plist below and the two are merged. So do the song type
        # (com.echoelmusic.song, a package: Files shows a song as one file) and the document type
        # that opens a tapped song in the app (E4).
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Echoel sends and receives MIDI over your local network when you turn on Network MIDI."
        INFOPLIST_FILE: Support/Info.plist
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        # Only Apple's own encryption (HTTPS for the store); no export-compliance question per build.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Automatic
        # App Groups: group.com.echoelmusic.shared, where the app records the plugin purchase for the
        # extension (PluginUnlock), and group.com.echoelmusic, where the earlier app kept its songs
        # (import at first start). Both are in the issued profiles since signing probe 5 (F17, 2026-10-21).
        CODE_SIGN_ENTITLEMENTS: Support/App/EchoelStudio.entitlements

  # Echoel Plugins — every Echoel Audio Unit in ONE extension under the one registered Audio Unit
  # id: Synth (aumu eSyn), Drums (eDrm), Sampler (eSmp), EQ/Compressor/Delay/Reverb (aufx
  # xEQ5/xCmp/xDly/xRvb), plus the earlier app's instrument (aumu echl) so saved sessions open.
  # One purchase unlocks them (`PluginUnlock`, Plugins/Shared, compiled into app and extension). Lessons from the legacy AUv3 (root
  # project.yml): AudioComponents under NSExtensionAttributes, a synchronous nonisolated
  # AUAudioUnitFactory, and explicit SDKROOT/SUPPORTED_PLATFORMS. The legacy rule "NO App Group
  # entitlement" held while the .auv3 App ID lacked the capability (every host failed with -3000).
  # The extension asks for group.com.echoelmusic.shared to READ the purchase (factory job 002); the
  # .auv3 profiles carry it since build 10008 (2026-10-19) and signing probe 5 (2026-10-21). A missing
  # group fails signing (on failure studio-testflight.yml prints every profile's groups), but signing
  # proves nothing in a host: the legacy extension signed and then returned -3000 in every host. If
  # Echoel Synth, Drums or EQ return -3000 in AUM, remove the group from EchoelPlugins.entitlements first.
  EchoelPlugins:
    type: app-extension
    platform: iOS
    sources:
      - path: Plugins/AUv3
        excludes:
          - "Info.plist"
      - path: Plugins/Shared
      - path: Support/Plugins/PrivacyInfo.xcprivacy
        type: file
        buildPhase: resources
    dependencies:
      - package: EchoelCore
      - package: EchoelDSP
      # The kernels and the Audio Unit side only. The extension never links the engine: a unit in a
      # foreign host plays its kernel directly, and EchoelHost does not depend on EchoelEngine.
      - package: EchoelEngine
        product: EchoelKernels
      - package: EchoelEngine
        product: EchoelHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.echoelmusic.app.auv3
        PRODUCT_NAME: EchoelPlugins
        INFOPLIST_FILE: Plugins/AUv3/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Support/Plugins/EchoelPlugins.entitlements
